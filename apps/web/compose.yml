name: theorem-os

services:
  web:
    image: theorem-os-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: web
      args:
        THEOREMOS_SOURCE_COMMIT: ${THEOREMOS_SOURCE_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8787:8787"
    # The web process calls the provider itself when a reader asks why a step failed; workers get the same mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      THEOREMOS_WEB_PUBLIC_URL: ${THEOREMOS_WEB_PUBLIC_URL:-http://127.0.0.1:8787}
      THEOREMOS_WEB_WORKER_IMAGE: theorem-os-worker:local
      THEOREMOS_WEB_CONCURRENCY: ${THEOREMOS_WEB_CONCURRENCY:-1}
      THEOREMOS_WEB_DATA_ROOT: /var/lib/theorem-os
      THEOREMOS_WEB_SESSION_TTL_SECONDS: ${THEOREMOS_WEB_SESSION_TTL_SECONDS:-2592000}
      THEOREMOS_WEB_PROVIDERS: "${THEOREMOS_WEB_PROVIDERS:-}"
      THEOREMOS_WEB_AUTH: ${THEOREMOS_WEB_AUTH:-}
      THEOREMOS_WEB_SMTP_URL: ${THEOREMOS_WEB_SMTP_URL:-}
      THEOREMOS_WEB_MAIL_FROM: ${THEOREMOS_WEB_MAIL_FROM:-}
      THEOREMOS_WEB_ALLOWLIST: ${THEOREMOS_WEB_ALLOWLIST:-}
      THEOREMOS_WEB_SIGNUP: ${THEOREMOS_WEB_SIGNUP:-allowlist}
      THEOREMOS_WEB_TERMS_VERSION: ${THEOREMOS_WEB_TERMS_VERSION:-}
      THEOREMOS_WEB_QUOTA_WINDOW_HOURS: ${THEOREMOS_WEB_QUOTA_WINDOW_HOURS:-24}
      THEOREMOS_WEB_QUOTA_RUNS: ${THEOREMOS_WEB_QUOTA_RUNS:-30}
      THEOREMOS_WEB_QUOTA_FORMALIZATIONS: ${THEOREMOS_WEB_QUOTA_FORMALIZATIONS:-8}
      THEOREMOS_WEB_QUOTA_EXPLANATIONS: ${THEOREMOS_WEB_QUOTA_EXPLANATIONS:-4}
      THEOREMOS_WEB_ADMINS: ${THEOREMOS_WEB_ADMINS:-}
      THEOREMOS_WEB_ADMIN_KEYS: ${THEOREMOS_WEB_ADMIN_KEYS:-}
      THEOREMOS_WEB_KEY_SECRET: ${THEOREMOS_WEB_KEY_SECRET:-}
      THEOREMOS_WEB_CLIENT_IP_HEADER: ${THEOREMOS_WEB_CLIENT_IP_HEADER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - research-data:/var/lib/theorem-os
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: theorem-os-worker:local
    profiles: ["build-worker"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: worker
      args:
        THEOREMOS_SOURCE_COMMIT: ${THEOREMOS_SOURCE_COMMIT:-unknown}

volumes:
  research-data:
