<!doctype html>
<html lang="zh-CN" class="share-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ee">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>研究成果 · TheoremOS</title>
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="share.css">
</head>
<body class="share-page">
  <main class="share-shell" id="main">
    <header class="share-top">
      <a class="brand" href="https://theoremos.top/" data-site="" aria-label="TheoremOS 官网"><img src="assets/mark.svg" alt="" width="26" height="26"><span>Theorem<span class="brand-os">OS</span></span></a>
      <div class="share-top-actions"><button type="button" id="locale-switch" class="text-button locale-switch" hidden></button><span class="share-kind">只读分享</span></div>
    </header>
    <p id="share-loading" class="share-state" role="status">正在读取分享内容…</p>
    <section id="share-missing" class="share-card share-state-card" hidden aria-labelledby="share-missing-heading">
      <h1 id="share-missing-heading">分享链接不可用</h1>
      <p id="share-missing-text">链接不存在，或分享者已经停止分享。</p>
    </section>
    <article id="share-content" class="share-content" hidden aria-labelledby="share-title">
      <header class="share-card share-heading">
        <span class="badge passed"><i data-lucide="shield-check"></i><span id="share-verdict">Lean 陈述证明通过</span></span>
        <h1 id="share-title" translate="no"></h1>
        <nav class="share-reading-nav" aria-label="阅读内容"><button type="button" data-share-jump="share-task-heading">原题</button><button type="button" data-share-jump="share-reading-heading">证明思路</button><button type="button" data-share-jump="share-source-heading">Lean 源码</button><button type="button" data-share-jump="share-checks-heading">验收记录</button></nav>
        <details class="share-research-info"><summary>研究配置与用量</summary><dl id="share-facts" class="facts share-facts"></dl></details>
      </header>
      <section class="share-card" aria-labelledby="share-task-heading">
        <h2 id="share-task-heading" tabindex="-1">研究任务</h2>
        <p id="share-task" class="task-content" translate="no"></p>
        <p id="share-confirmation" class="chat-statement-verdict"></p>
        <p class="field-note">Lean 验收证明的是这份陈述，不能替代对自然语言原意的核对。</p>
        <details id="share-review" hidden><summary>形式化审核</summary>
          <h3>独立回译</h3><div id="share-backtranslation" class="task-content" translate="no"></div>
          <h3>具体对应关系</h3><div id="share-correspondences" class="chat-correspondences"></div>
        </details>
      </section>
      <div id="share-reading-host" class="share-card share-reading-container"></div>
      <div id="share-receiver-host" class="share-card"></div>
      <section class="share-card" aria-labelledby="share-source-heading">
        <div class="share-source-top">
          <h2 id="share-source-heading" tabindex="-1">Lean 源码</h2>
          <div class="source-switch" role="group" aria-label="源码版本">
            <button type="button" data-share-view="proof" aria-pressed="true">验收证明</button>
            <button type="button" data-share-view="source" aria-pressed="false">原始题目</button>
          </div>
          <div class="source-actions">
            <button type="button" id="share-copy" class="icon-button" aria-label="复制当前源码" title="复制当前源码"><i data-lucide="copy"></i></button>
            <button type="button" id="share-download" class="icon-button" aria-label="下载 Lean 文件" title="下载 Lean 文件"><i data-lucide="download"></i></button>
          </div>
        </div>
        <div class="code-scroll result-proof-code share-code lean-wrap" role="region" tabindex="0" aria-labelledby="share-source-heading"><pre class="source-line-numbers" id="share-line-numbers" aria-hidden="true"></pre><pre class="result-proof-text" translate="no"><code id="share-code"></code></pre></div>
      </section>
      <section class="share-card" aria-labelledby="share-checks-heading">
        <h2 id="share-checks-heading" tabindex="-1">验收记录</h2>
        <ul id="share-checks" class="share-checks"></ul>
        <details id="share-credentials" class="share-credentials"><summary>验收凭据</summary><dl id="share-identity" class="facts share-identity"></dl></details>
      </section>
      <p class="share-note">这是分享者创建链接时的只读快照，不包含 API Key、模型服务地址、运行日志和账号信息。分享者可以随时停止分享。</p>
    </article>
    <div id="share-toast" class="toast" role="status" hidden></div>
  </main>
  <noscript><div class="no-script">需要启用 JavaScript 才能查看分享内容。</div></noscript>
  <script src="share.js" defer></script>
</body>
</html>
