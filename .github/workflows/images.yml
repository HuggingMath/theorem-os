name: Publish workbench images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/images.yml'
      - 'apps/web/**'
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'resources/**'
      - 'docs/assets/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'extraction.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The web service starts workers by tag, so both images of one commit are published together.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - name: Free disk for the Mathlib layer
        if: matrix.target == 'worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/likc1606/theorem-os-${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inline cache keeps the 7.5 GB Mathlib layer reusable without the 10 GB Actions cache limit.
          cache-from: type=registry,ref=ghcr.io/likc1606/theorem-os-${{ matrix.target }}:main
          cache-to: type=inline
