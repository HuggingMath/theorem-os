name: Publish workbench images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A tag and a manual run can publish the same commit.
concurrency:
  group: images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: (github.event_name == 'push' && !github.event.deleted) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [web, worker]
    steps:
      - name: Free disk for the Mathlib layer
        if: matrix.target == 'worker'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/huggingmath/theorem-os-${{ matrix.target }}:${{ github.sha }}
          build-args: THEOREMOS_SOURCE_COMMIT=${{ github.sha }}
          # This tag is a build cache, never a deployable release alias.
          cache-from: |
            type=registry,ref=ghcr.io/huggingmath/theorem-os-${{ matrix.target }}:buildcache
            type=registry,ref=ghcr.io/likc1606/theorem-os-${{ matrix.target }}:buildcache
          cache-to: type=registry,ref=ghcr.io/huggingmath/theorem-os-${{ matrix.target }}:buildcache,mode=min

  release:
    needs: publish
    permissions:
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the complete image pair
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          web="ghcr.io/huggingmath/theorem-os-web:$RELEASE_COMMIT"
          worker="ghcr.io/huggingmath/theorem-os-worker:$RELEASE_COMMIT"
          web_digest=$(docker buildx imagetools inspect "$web" --format '{{.Manifest.Digest}}')
          worker_digest=$(docker buildx imagetools inspect "$worker" --format '{{.Manifest.Digest}}')
          jq -n --arg commit "$RELEASE_COMMIT" --arg web "$web" --arg webDigest "$web_digest" \
            --arg worker "$worker" --arg workerDigest "$worker_digest" \
            '{schema:"theorem-os.image-release.v1",commit:$commit,web:{image:$web,digest:$webDigest},worker:{image:$worker,digest:$workerDigest}}' > image-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-release-${{ github.sha }}
          path: image-release.json
          if-no-files-found: error
